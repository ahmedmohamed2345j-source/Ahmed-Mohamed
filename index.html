<style>
  :root{
    --bg-top:#0a1a3a;
    --bg-bottom:#050d1f;
    --card:#0f2247;
    --accent:#3b82f6;
    --text:#eaf1ff;
    --muted:#9db4d9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(90,150,255,0.35) 0%, rgba(90,150,255,0) 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:40px 16px 60px;
  }
  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .avatar-wrap{
    width:130px;
    height:130px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid rgba(255,255,255,0.15);
    box-shadow:0 8px 30px rgba(0,0,0,0.4), 0 0 0 6px rgba(59,130,246,0.08);
    margin-bottom:18px;
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .name{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.3px;
    margin-bottom:6px;
  }
  .phone{
    font-size:15px;
    color:var(--muted);
    margin-bottom:28px;
    text-decoration:none;
  }
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:14px 18px;
    text-decoration:none;
    color:var(--text);
    transition:transform .15s ease, background .15s ease;
  }
  .link-row:active{
    transform:scale(0.98);
    background:#132a56;
  }
  .icon{
    width:26px;
    height:26px;
    flex-shrink:0;
  }
  .icon svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:var(--text);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .link-text{
    font-size:16px;
    font-weight:500;
  }
</style>
</head>
